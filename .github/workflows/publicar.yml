# Arma el juego y lo deja en la rama gh-pages, que es la que sirve GitHub Pages.
name: Publicar el juego
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  sitio:
    runs-on: ubuntu-latest
    steps:
      # una sola versión: la de luz avanzada (relieve sin pérdida). Pesa ~1,25 GB: si GitHub Pages la rechaza por el
      # tope de 1 GB, el sitio anterior sigue en línea
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mv juego/dist /tmp/sitio
      - name: Subir a gh-pages
        run: |
          cd /tmp/sitio
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sitio de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
